<section class="agent-page" aria-labelledby="agent-title">
  <!-- Placeholder notice: the only treaty of the page until the real
       agent lands — the prompt just echoes instructions. -->
  <h1 id="agent-title" class="agent-notice">{{ 'ai.notice' | t }}</h1>

  <div class="agent-column">
    <h2 class="agent-transcript-title">{{ 'ai.transcript' | t }}</h2>

    <div class="agent-transcript" role="log" aria-live="polite">
      @if (entries().length === 0) {
        <p class="agent-empty">{{ 'ai.empty' | t }}</p>
      } @else {
        @for (entry of entries(); track entry.id) {
          <article class="agent-entry" [class.expanded]="entry.expanded">
            <p
              class="agent-entry-text"
              [class.folded]="!entry.expanded"
              [class.multiline]="entry.text.includes('\n')"
            >
              {{ entry.text }}
            </p>
            <button
              type="button"
              class="agent-toggle"
              (click)="toggleExpanded(entry.id)"
              [attr.aria-expanded]="entry.expanded"
              [attr.aria-label]="(entry.expanded ? 'ai.refold' : 'ai.unfold') | t"
              [title]="(entry.expanded ? 'ai.refold' : 'ai.unfold') | t"
            >
              <span aria-hidden="true">{{ entry.expanded ? '⌃' : '⌄' }}</span>
            </button>
          </article>
        }
      }
    </div>

    <!-- Always-ready prompt at the bottom of the column, chat style. -->
    <div class="agent-prompt">
      <label class="visually-hidden-label" for="agent-prompt-input">
        {{ 'ai.promptLabel' | t }}
      </label>
      <textarea
        id="agent-prompt-input"
        class="agent-prompt-input"
        rows="2"
        [value]="draft()"
        (input)="onDraftInput($event)"
        (keydown)="onPromptKeydown($event, agentTextarea)"
        [placeholder]="'ai.promptPlaceholder' | t"
        #agentTextarea
      ></textarea>
      <button
        type="button"
        class="btn btn-primary agent-send"
        (click)="send(agentTextarea)"
        [attr.aria-label]="'ai.send' | t"
      >
        <span aria-hidden="true">➤</span>
        {{ 'ai.send' | t }}
      </button>
    </div>
  </div>
</section>
